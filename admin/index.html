<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Admin — Chas Pulido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ivory:#f5f3ee;--white:#fcfbf8;--ink:#171717;--muted:#66635d;--border:#ddd9d1;
  --open:#3d8c40;--paused:#c9960c;--closed:#b03a2e;
  --font-sans:'Space Grotesk',system-ui,sans-serif;
  --font-serif:Georgia,'Times New Roman',serif;
}
html{font-size:14px;}
body{font-family:var(--font-sans);background:var(--ivory);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
input,textarea,select,button{font-family:inherit;font-size:inherit;border-radius:0;outline:none;}
button{cursor:pointer;}
a{color:var(--ink);text-decoration:none;}

/* ── sign-in ── */
#signin-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--ivory);}
.signin-box{width:320px;}
.signin-eyebrow{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:32px;}
.signin-title{font-family:var(--font-serif);font-size:22px;font-weight:400;margin-bottom:24px;}
.signin-field{display:block;width:100%;border:1px solid var(--border);background:var(--white);padding:10px 12px;font-size:13px;margin-bottom:12px;color:var(--ink);}
.signin-field:focus{border-color:var(--ink);}
.signin-btn{display:block;width:100%;background:var(--ink);color:var(--white);border:none;padding:11px;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:500;margin-top:4px;}
.signin-btn:hover{opacity:0.85;}
.signin-btn:disabled{opacity:0.4;cursor:default;}
.signin-error{font-size:11px;color:var(--closed);margin-top:12px;min-height:16px;}

/* ── checking screen ── */
#checking-screen{display:none;align-items:center;justify-content:center;min-height:100vh;background:var(--ivory);}
.checking-text{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}

/* ── admin panel ── */
#admin-panel{display:none;min-height:100vh;background:var(--ivory);}
.admin-header{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--white);}
.admin-wordmark{font-family:var(--font-serif);font-size:16px;font-weight:400;letter-spacing:0.5px;}
.admin-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:400;}
.admin-user{display:flex;align-items:center;gap:16px;}
.admin-email{font-size:11px;color:var(--muted);}
.admin-signout{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--border);padding:5px 12px;font-weight:500;}
.admin-signout:hover{border-color:var(--ink);color:var(--ink);}

/* ── stats ── */
.stats-bar{display:flex;gap:24px;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--white);}
.stat{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
.stat strong{color:var(--ink);font-weight:600;font-size:13px;margin-right:4px;}

/* ── filter tabs ── */
.filter-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid var(--border);}
.filter-tabs{display:flex;gap:0;}
.filter-tab{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--border);padding:6px 14px;font-weight:500;border-right:none;}
.filter-tab:last-child{border-right:1px solid var(--border);}
.filter-tab.active{background:var(--ink);color:var(--white);border-color:var(--ink);}
.filter-tab:hover:not(.active){background:var(--white);color:var(--ink);}
.btn-new{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;background:var(--ink);color:var(--white);border:none;padding:7px 16px;font-weight:500;}
.btn-new:hover{opacity:0.85;}

/* ── ledger ── */
.ledger{padding:0 32px 48px;}
.ledger-empty{padding:48px 0;text-align:center;font-size:12px;color:var(--muted);}

/* row */
.opp-row{display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid var(--border);position:relative;}
.opp-row:hover .opp-actions{opacity:1;}
.opp-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.opp-dot.open{background:var(--open);}
.opp-dot.paused{background:var(--paused);}
.opp-dot.closed{background:var(--closed);}
.opp-main{flex:1;min-width:0;}
.opp-title{font-family:var(--font-serif);font-size:15px;font-weight:400;margin-bottom:3px;}
.opp-desc{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:500px;margin-bottom:6px;}
.opp-thumbs{display:flex;gap:4px;align-items:center;margin-bottom:6px;}
.opp-thumb-img{width:36px;height:36px;object-fit:cover;border:1px solid var(--border);}
.opp-thumb-placeholder{width:36px;height:36px;border:1px solid var(--border);background:var(--ivory);display:flex;align-items:center;justify-content:center;font-size:7px;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted);overflow:hidden;text-align:center;line-height:1.1;padding:2px;}
.opp-thumb-overflow{font-size:10px;color:var(--muted);margin-left:4px;}
.opp-meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.opp-type{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid var(--border);padding:3px 8px;color:var(--muted);font-weight:500;}
.opp-deadline{font-size:10px;color:var(--muted);}
.opp-deadline .countdown{font-weight:500;color:var(--ink);}
.opp-deadline .overdue{color:var(--closed);font-weight:500;}
.opp-created{font-size:10px;color:var(--muted);}
.opp-actions{position:absolute;top:12px;right:0;display:flex;gap:0;opacity:0;transition:opacity 0.15s;}
.opp-act{font-size:8px;letter-spacing:1px;text-transform:uppercase;background:var(--white);border:1px solid var(--border);padding:4px 8px;color:var(--muted);font-weight:500;border-right:none;}
.opp-act:last-child{border-right:1px solid var(--border);}
.opp-act:hover{color:var(--ink);border-color:var(--ink);z-index:1;position:relative;}
.opp-act.danger:hover{color:var(--closed);border-color:var(--closed);}

/* ── inline forms ── */
.form-container{border-bottom:1px solid var(--border);padding:20px 0;display:none;}
.form-container.visible{display:block;}
.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px;}
.form-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500;}
.form-input{border:1px solid var(--border);background:var(--white);padding:8px 10px;font-size:12px;color:var(--ink);width:100%;}
.form-input:focus{border-color:var(--ink);}
textarea.form-input{resize:vertical;min-height:60px;font-family:var(--font-sans);}
select.form-input{-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%2366635d'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px;}
.form-artwork-section{margin-bottom:12px;}
.form-artwork-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px;}
.form-artwork-selected{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:8px;min-height:24px;}
.form-artwork-chip{display:flex;align-items:center;gap:4px;background:var(--white);border:1px solid var(--border);padding:2px 8px 2px 2px;font-size:10px;color:var(--ink);}
.form-artwork-chip img{width:20px;height:20px;object-fit:cover;}
.form-artwork-chip .chip-remove{cursor:pointer;color:var(--muted);font-size:12px;margin-left:2px;}
.form-artwork-chip .chip-remove:hover{color:var(--closed);}
.btn-browse{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;background:none;border:1px solid var(--border);padding:5px 12px;color:var(--muted);font-weight:500;}
.btn-browse:hover{border-color:var(--ink);color:var(--ink);}
.form-actions{display:flex;gap:8px;margin-top:4px;}
.btn-save{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;background:var(--ink);color:var(--white);border:none;padding:7px 16px;font-weight:500;}
.btn-save:hover{opacity:0.85;}
.btn-save:disabled{opacity:0.4;cursor:default;}
.btn-cancel{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;background:none;border:1px solid var(--border);color:var(--muted);padding:7px 16px;font-weight:500;}
.btn-cancel:hover{border-color:var(--ink);color:var(--ink);}

/* ── artwork picker overlay ── */
#artwork-picker{display:none;position:fixed;inset:0;z-index:1000;background:rgba(23,23,23,0.55);backdrop-filter:blur(2px);}
#artwork-picker.visible{display:flex;align-items:center;justify-content:center;}
.picker-panel{width:90vw;max-width:960px;height:85vh;background:var(--white);display:flex;flex-direction:column;border:1px solid var(--border);overflow:hidden;}
.picker-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.picker-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:500;flex-shrink:0;}
.picker-search{flex:1;border:1px solid var(--border);background:var(--ivory);padding:7px 10px;font-size:12px;color:var(--ink);}
.picker-search:focus{border-color:var(--ink);}
.picker-close{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;background:none;border:1px solid var(--border);padding:5px 12px;color:var(--muted);font-weight:500;flex-shrink:0;}
.picker-close:hover{border-color:var(--ink);color:var(--ink);}
.picker-grid{flex:1;overflow-y:auto;padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;align-content:start;}
.picker-item{position:relative;cursor:pointer;border:2px solid transparent;transition:border-color 0.1s;aspect-ratio:1/1;overflow:hidden;background:var(--ivory);}
.picker-item:hover{border-color:var(--muted);}
.picker-item.selected{border-color:var(--ink);}
.picker-item img{width:100%;height:100%;object-fit:cover;display:block;}
.picker-item .picker-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted);text-align:center;padding:8px;line-height:1.3;}
.picker-item .picker-check{position:absolute;top:4px;right:4px;width:20px;height:20px;background:var(--ink);color:var(--white);display:none;align-items:center;justify-content:center;font-size:13px;line-height:1;}
.picker-item.selected .picker-check{display:flex;}
.picker-item-label{position:absolute;bottom:0;left:0;right:0;background:rgba(252,251,248,0.88);padding:3px 5px;font-size:8px;letter-spacing:0.5px;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.picker-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.picker-count{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
.picker-done{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;background:var(--ink);color:var(--white);border:none;padding:7px 20px;font-weight:500;}
.picker-done:hover{opacity:0.85;}

/* ── utility ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fade-in{animation:fadeIn 0.2s ease;}
</style>
</head>

<!-- ── SIGN-IN SCREEN ── -->
<div id="signin-screen">

    <div class="signin-eyebrow">STUDIO ACCESS</div>

      <input class="signin-field" type="email" id="signin-email" placeholder="Email" required autocomplete="email">
      <input class="signin-field" type="password" id="signin-password" placeholder="Password" required autocomplete="current-password">
      <button class="signin-btn" type="submit" id="signin-btn">SIGN IN</button>
    </form>
    <div class="signin-error" id="signin-error"></div>
  </div>
</div>

<!-- ── CHECKING SCREEN ── -->
<div id="checking-screen">

  <div class="stats-bar" id="stats-bar"></div>

    </div>
    <button class="btn-new" id="btn-new">+ NEW</button>

  <div class="ledger" id="ledger">

    <div class="form-container" id="create-form-container"></div>

    <div id="ledger-rows"></div>

</div>

<!-- ── ARTWORK PICKER OVERLAY ── -->
<div id="artwork-picker">

      <button class="picker-close" id="picker-close-btn">CANCEL</button>
    </div>
    <div class="picker-grid" id="picker-grid"></div>
    <div class="picker-footer">
      <div class="picker-count" id="picker-count">0 SELECTED</div>
      <button class="picker-done" id="picker-done-btn">DONE</button>

  </div>
</div>

/* ───────────────────────────────────────────

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function headers(token, mode) {
  const h = { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + token };
  if (mode === 'read')  h['Accept-Profile'] = SCHEMA;
  if (mode === 'write') { h['Content-Profile'] = SCHEMA; h['Content-Type'] = 'application/json'; }
  return h;
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function countdown(iso) {
  if (!iso) return '';
  const now = new Date(), dl = new Date(iso);
  const diff = dl - now;
  if (diff < 0) return '<span class="overdue">overdue</span>';
  const days = Math.ceil(diff / 86400000);
  if (days === 0) return '<span class="countdown">today</span>';
  if (days === 1) return '<span class="countdown">tomorrow</span>';
  return '<span class="countdown">' + days + 'd</span>';
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ───────────────────────────────────────────
   AUTH
   ─────────────────────────────────────────── */
function getSession() {
  try {
    const s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
    if (s && s.expiresAt > Date.now()) return s;
  } catch {}
  return null;
}

function saveSession(s) {
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(s));
}

function clearSession() {
  sessionStorage.removeItem(SESSION_KEY);
}

async function signIn(email, password) {
  const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  if (!res.ok) throw new Error('Sign-in failed. Check the email and password.');
  const j = await res.json();
  return {
    token: j.access_token,
    email: j.user?.email || email,
    expiresAt: Date.now() + (j.expires_in || 3600) * 1000 - 60000
  };
}

async function checkAdmin(token) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/am_i_admin', {
    method: 'POST',
    headers: { ...headers(token, 'write') },
    body: '{}'
  });
  return res.ok && (await res.json()) === true;
}

/* ───────────────────────────────────────────
   CRUD
   ─────────────────────────────────────────── */
async function fetchOpportunities() {
  const res = await fetch(SUPABASE_URL + '/rest/v1/opportunities?select=*&order=created_at.desc', {
    headers: headers(session.token, 'read')
  });
  if (!res.ok) throw new Error('Failed to load opportunities.');
  return res.json();
}

async function createOpportunity(data) {
  const body = { ...data, created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
  const res = await fetch(SUPABASE_URL + '/rest/v1/opportunities', {
    method: 'POST',
    headers: { ...headers(session.token, 'write'), Prefer: 'return=representation' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('Failed to create opportunity.');
  return res.json();
}

async function updateOpportunity(id, data) {
  const body = { ...data, updated_at: new Date().toISOString() };
  const res = await fetch(SUPABASE_URL + '/rest/v1/opportunities?id=eq.' + id, {
    method: 'PATCH',
    headers: { ...headers(session.token, 'write'), Prefer: 'return=minimal' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('Failed to update opportunity.');
}

async function deleteOpportunity(id) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/opportunities?id=eq.' + id, {
    method: 'DELETE',
    headers: { ...headers(session.token, 'write'), Prefer: 'return=minimal' }
  });
  if (!res.ok) throw new Error('Failed to delete opportunity.');
}

function renderStats() {
  const open = opportunities.filter(o => o.status === 'open').length;
  const closed = opportunities.filter(o => o.status === 'closed').length;
  const paused = opportunities.filter(o => o.status === 'paused').length;
  const total = opportunities.length;
  $('#stats-bar').innerHTML =
    '<div class="stat"><strong>' + open + '</strong>OPEN</div>' +
    '<div class="stat"><strong>' + closed + '</strong>CLOSED</div>' +
    '<div class="stat"><strong>' + paused + '</strong>PAUSED</div>' +
    '<div class="stat"><strong>' + total + '</strong>TOTAL</div>';
}

/* ───────────────────────────────────────────
   RENDER ARTWORK THUMBS (for a row)
   ─────────────────────────────────────────── */
function renderArtworkThumbs(ids) {
  if (!ids || ids.length === 0) return '';
  const MAX = 6;
  const show = ids.slice(0, MAX);
  let html = '';
  show.forEach(id => {
    const c = CATALOG_MAP[id];
    if (!c) return;
    if (c.thumb) {
      html += '<img class="opp-thumb-img" src="' + esc(c.thumb) + '" alt="' + esc(c.title) + '" title="' + esc(c.title) + '">';
    } else {
      html += '<div class="opp-thumb-placeholder" title="' + esc(c.title) + '">' + esc(c.title) + '</div>';
    }
  });
  if (ids.length > MAX) {
    html += '<span class="opp-thumb-overflow">+' + (ids.length - MAX) + '</span>';
  }
  return html;
}

function getFormData(prefix) {
  const val = id => { const el = document.getElementById(prefix + '-' + id); return el ? el.value.trim() : ''; };
  const chips = document.querySelectorAll('#' + prefix + '-artwork-chips .form-artwork-chip');
  const artwork_ids = [];
  chips.forEach(c => { if (c.dataset.id) artwork_ids.push(c.dataset.id); });
  return {
    title: val('title'),
    description: val('description') || null,
    type: val('type') || null,
    status: val('status') || 'open',
    deadline: val('deadline') ? new Date(val('deadline') + 'T23:59:59Z').toISOString() : null,
    url: val('url') || null,
    requirements: val('requirements') || null,
    notes: val('notes') || null,
    artwork_ids: artwork_ids.length ? artwork_ids : null
  };
}

/* ───────────────────────────────────────────
   CHIP MANAGEMENT
   ─────────────────────────────────────────── */
function removeChip(prefix, artId) {
  const chip = document.querySelector('#' + prefix + '-artwork-chips .form-artwork-chip[data-id="' + artId + '"]');
  if (chip) chip.remove();
}

function addChips(prefix, ids) {
  const container = document.getElementById(prefix + '-artwork-chips');
  if (!container) return;
  // get current
  const existing = new Set();
  container.querySelectorAll('.form-artwork-chip').forEach(c => existing.add(c.dataset.id));
  // clear and rebuild with new set
  container.innerHTML = '';
  ids.forEach(function(id) {
    var c = CATALOG_MAP[id];
    if (!c) return;
    var div = document.createElement('div');
    div.className = 'form-artwork-chip';
    div.dataset.id = id;
    div.innerHTML = (c.thumb ? '<img src="' + esc(c.thumb) + '" alt="">' : '') +
      '<span>' + esc(c.title) + '</span>' +
      '<span class="chip-remove" onclick="removeChip(\'' + prefix + '\',\'' + esc(id) + '\')">&times;</span>';
    container.appendChild(div);
  });
}

function getCurrentChipIds(prefix) {
  const chips = document.querySelectorAll('#' + prefix + '-artwork-chips .form-artwork-chip');
  const ids = [];
  chips.forEach(c => { if (c.dataset.id) ids.push(c.dataset.id); });
  return ids;
}

   ─────────────────────────────────────────── */
function renderLedger() {
  renderStats();
  const filtered = activeFilter === 'all'
    ? opportunities
    : opportunities.filter(o => o.status === activeFilter);
  const container = $('#ledger-rows');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="ledger-empty">No opportunities' + (activeFilter !== 'all' ? ' with status "' + activeFilter + '"' : '') + '.</div>';
    return;
  }
  let html = '';
  filtered.forEach(function(opp) {
    const isEditing = editingId === opp.id;
    if (isEditing) {
      html += '<div class="form-container visible fade-in" id="edit-form-wrap-' + opp.id + '">' + buildFormHTML('edit', opp) + '</div>';
    } else {
      const artHtml = renderArtworkThumbs(opp.artwork_ids);
      html += '<div class="opp-row">' +
        '<div class="opp-dot ' + esc(opp.status || 'open') + '"></div>' +
        '<div class="opp-main">' +
          '<div class="opp-title">' + esc(opp.title) + '</div>' +
          (opp.description ? '<div class="opp-desc">' + esc(opp.description) + '</div>' : '') +
          (artHtml ? '<div class="opp-thumbs">' + artHtml + '</div>' : '') +
          '<div class="opp-meta">' +
            (opp.type ? '<span class="opp-type">' + esc(opp.type) + '</span>' : '') +
            (opp.deadline ? '<span class="opp-deadline">' + formatDate(opp.deadline) + ' ' + countdown(opp.deadline) + '</span>' : '') +
            '<span class="opp-created">' + formatDate(opp.created_at) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="opp-actions">' +
          '<button class="opp-act" onclick="startEdit(\'' + opp.id + '\')">EDIT</button>' +
          (opp.status === 'closed'
            ? '<button class="opp-act" onclick="setStatus(\'' + opp.id + '\',\'open\')">REOPEN</button>'
            : '<button class="opp-act" onclick="setStatus(\'' + opp.id + '\',\'closed\')">CLOSE</button>') +
          (opp.status === 'paused'
            ? '<button class="opp-act" onclick="setStatus(\'' + opp.id + '\',\'open\')">RESUME</button>'
            : '<button class="opp-act" onclick="setStatus(\'' + opp.id + '\',\'paused\')">PAUSE</button>') +
          (opp.url ? '<button class="opp-act" onclick="window.open(\'' + esc(opp.url) + '\',\'_blank\')">LINK</button>' : '') +
          '<button class="opp-act danger" onclick="confirmDelete(\'' + opp.id + '\')">DEL</button>' +
        '</div>' +
      '</div>';
    }
  });
  container.innerHTML = html;

  // bind edit form events if editing
  if (editingId) {
    const saveBtn = document.getElementById('edit-save');
    const cancelBtn = document.getElementById('edit-cancel');
    if (saveBtn) saveBtn.addEventListener('click', handleEditSave);
    if (cancelBtn) cancelBtn.addEventListener('click', function() { editingId = null; renderLedger(); });
  }
}

/* ───────────────────────────────────────────
   ACTIONS
   ─────────────────────────────────────────── */
function startEdit(id) {
  editingId = id;
  hideCreateForm();
  renderLedger();
}

async function handleEditSave() {
  const data = getFormData('edit');
  if (!data.title) { alert('Title is required.'); return; }
  const btn = document.getElementById('edit-save');
  btn.disabled = true; btn.textContent = 'SAVING...';
  try {
    await updateOpportunity(editingId, data);
    editingId = null;
    await reloadAndRender();
  } catch (e) { alert(e.message); btn.disabled = false; btn.textContent = 'SAVE CHANGES'; }
}

async function setStatus(id, status) {
  try {
    await updateOpportunity(id, { status: status });
    await reloadAndRender();
  } catch (e) { alert(e.message); }
}

async function confirmDelete(id) {
  const opp = opportunities.find(o => o.id === id);
  if (!confirm('Delete "' + (opp ? opp.title : id) + '"? This cannot be undone.')) return;
  try {
    await deleteOpportunity(id);
    await reloadAndRender();
  } catch (e) { alert(e.message); }
}

/* ───────────────────────────────────────────
   CREATE FORM
   ─────────────────────────────────────────── */
function showCreateForm() {
  editingId = null;
  const c = $('#create-form-container');
  c.innerHTML = buildFormHTML('create', null);
  c.classList.add('visible');
  c.classList.add('fade-in');
  const saveBtn = document.getElementById('create-save');
  const cancelBtn = document.getElementById('create-cancel');
  saveBtn.addEventListener('click', handleCreateSave);
  cancelBtn.addEventListener('click', hideCreateForm);
  renderLedger();
}

function hideCreateForm() {
  const c = $('#create-form-container');
  c.classList.remove('visible');
  c.innerHTML = '';
}

async function handleCreateSave() {
  const data = getFormData('create');
  if (!data.title) { alert('Title is required.'); return; }
  const btn = document.getElementById('create-save');
  btn.disabled = true; btn.textContent = 'CREATING...';
  try {
    await createOpportunity(data);
    hideCreateForm();
    await reloadAndRender();
  } catch (e) { alert(e.message); btn.disabled = false; btn.textContent = 'CREATE'; }
}

/* ───────────────────────────────────────────
   ARTWORK PICKER
   ─────────────────────────────────────────── */
function buildPickerGrid(query) {
  const grid = $('#picker-grid');
  const q = (query || '').toLowerCase();
  let html = '';
  CATALOG_DATA.forEach(function(c) {
    if (q && c.title.toLowerCase().indexOf(q) === -1 && c.id.toLowerCase().indexOf(q) === -1) return;
    const sel = pickerSelected.indexOf(c.id) !== -1;
    html += '<div class="picker-item' + (sel ? ' selected' : '') + '" data-id="' + esc(c.id) + '">' +
      (c.thumb
        ? '<img src="' + esc(c.thumb) + '" alt="' + esc(c.title) + '" loading="lazy">'
        : '<div class="picker-placeholder">' + esc(c.title) + '</div>') +
      '<div class="picker-check">&#10003;</div>' +
      '<div class="picker-item-label">' + esc(c.id) + '</div>' +
    '</div>';
  });
  grid.innerHTML = html;
  updatePickerCount();

  // bind clicks
  grid.querySelectorAll('.picker-item').forEach(function(el) {
    el.addEventListener('click', function() {
      const id = el.dataset.id;
      const idx = pickerSelected.indexOf(id);
      if (idx === -1) {
        pickerSelected.push(id);
        el.classList.add('selected');
      } else {
        pickerSelected.splice(idx, 1);
        el.classList.remove('selected');
      }
      updatePickerCount();
    });
  });
}

function updatePickerCount() {
  $('#picker-count').textContent = pickerSelected.length + ' SELECTED';
}

function openPicker(prefix) {
  pickerTarget = prefix;
  pickerSelected = getCurrentChipIds(prefix).slice();
  const overlay = $('#artwork-picker');
  overlay.classList.add('visible');
  $('#picker-search').value = '';
  buildPickerGrid('');
  $('#picker-search').focus();
}

function closePicker(apply) {
  if (apply && pickerTarget) {
    addChips(pickerTarget, pickerSelected);
  }
  $('#artwork-picker').classList.remove('visible');
  pickerTarget = null;
  pickerSelected = [];
}

/* ───────────────────────────────────────────
   RELOAD
   ─────────────────────────────────────────── */
async function reloadAndRender() {
  opportunities = await fetchOpportunities();
  renderLedger();
}

/* ───────────────────────────────────────────
   INIT
   ─────────────────────────────────────────── */
async function init() {
  session = getSession();
  if (!session) {
    showScreen('signin');
    return;
  }
  // verify admin
  showScreen('checking');
  try {
    const ok = await checkAdmin(session.token);
    if (!ok) { clearSession(); showScreen('signin'); $('#signin-error').textContent = 'Not an admin account.'; return; }
  } catch {
    clearSession(); showScreen('signin'); return;
  }
  enterAdmin();
}

async function enterAdmin() {
  showScreen('admin');
  $('#admin-email').textContent = session.email;
  try {
    await reloadAndRender();
  } catch (e) {
    $('#ledger-rows').innerHTML = '<div class="ledger-empty">Failed to load: ' + esc(e.message) + '</div>';
  }
}

/* ───────────────────────────────────────────
   EVENT BINDINGS
   ─────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', function() {
  // Sign-in form
  $('#signin-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = $('#signin-email').value.trim();
    const pw = $('#signin-password').value;
    const btn = $('#signin-btn');
    const err = $('#signin-error');
    err.textContent = '';
    btn.disabled = true; btn.textContent = 'SIGNING IN...';
    try {
      session = await signIn(email, pw);
      saveSession(session);
      // check admin
      showScreen('checking');
      const ok = await checkAdmin(session.token);
      if (!ok) { clearSession(); session = null; showScreen('signin'); err.textContent = 'Not an admin account.'; btn.disabled = false; btn.textContent = 'SIGN IN'; return; }
      enterAdmin();
    } catch (ex) {
      err.textContent = ex.message;
      btn.disabled = false; btn.textContent = 'SIGN IN';
    }
  });

  // Sign-out
  $('#btn-signout').addEventListener('click', function() {
    clearSession(); session = null; showScreen('signin');
    $('#signin-error').textContent = '';
    $('#signin-email').value = '';
    $('#signin-password').value = '';
    $('#signin-btn').disabled = false;
    $('#signin-btn').textContent = 'SIGN IN';
  });

  // Filter tabs
  $('#filter-tabs').addEventListener('click', function(e) {
    const tab = e.target.closest('.filter-tab');
    if (!tab) return;
    $$('.filter-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeFilter = tab.dataset.filter;
    renderLedger();
  });

  // New button
  $('#btn-new').addEventListener('click', function() {
    showCreateForm();
  });

  // Picker search
  $('#picker-search').addEventListener('input', function() {
    buildPickerGrid(this.value);
  });

  // Picker done
  $('#picker-done-btn').addEventListener('click', function() {
    closePicker(true);
  });

  // Picker cancel / close
  $('#picker-close-btn').addEventListener('click', function() {
    closePicker(false);
  });

  // Picker overlay backdrop click
  $('#artwork-picker').addEventListener('click', function(e) {
    if (e.target === this) closePicker(false);
  });

  // Escape key closes picker
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && $('#artwork-picker').classList.contains('visible')) {
      closePicker(false);
    }
  });

  // Boot
  init();
});
</script>
</body>
