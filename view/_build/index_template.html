<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chas Pulido - Viewing Rooms</title>
<meta name="description" content="Viewing rooms for four series of paintings by Chas Pulido.">
<meta property="og:title" content="Chas Pulido - Viewing Rooms">
<meta property="og:description" content="Four series of paintings by Chas Pulido, each in its own room.">
<meta property="og:image" content="https://pulido.art/img/2026-30-1600.webp">
<link rel="icon" href="heart.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wall:#f6f5f2;--ink:#1d1b1a;--mute:#76716c;--rule:#dcd8d2;--accent:#CC4F1F;--ease:cubic-bezier(.2,.7,.1,1);--serif:'Playfair Display',Georgia,serif;--sans:'Space Grotesk','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--wall);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-bottom:1px solid var(--rule)}
header .name{display:flex;align-items:center;gap:12px}
header img{width:30px;height:30px}
header nav{display:flex;gap:22px}
header nav a{border-bottom:1px solid transparent;padding-bottom:2px}
header nav a:hover{border-color:currentColor}
.intro{max-width:980px;margin:0 auto;padding:110px 28px 70px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end}
.intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(46px,7vw,92px);line-height:.95}
.intro h1 em{font-style:italic}
.intro p{font-size:17px;line-height:1.6;color:var(--mute)}
.rooms{max-width:1240px;margin:0 auto;padding:0 28px 120px;display:grid;grid-template-columns:repeat(2,1fr);gap:70px 44px}
.room{display:block}
.room .cover{aspect-ratio:4/3;position:relative;overflow:hidden;background:#e9e6e1}
.room .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.room:hover .cover img{transform:scale(1.04)}
.room .strip{display:flex;gap:6px;margin-top:6px;height:54px}
.room .strip img{height:100%;flex:1;object-fit:cover;min-width:0}
.room .meta{display:flex;justify-content:space-between;margin-top:22px;color:var(--mute)}
.room h2{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;margin-top:8px}
.room p{font-size:16px;line-height:1.55;margin-top:10px;max-width:520px}
.room .go{display:inline-block;margin-top:16px;border-bottom:1px solid var(--ink);padding-bottom:3px}
footer{background:#0b0b0c;color:#fff;padding:60px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
footer .mk{display:flex;align-items:center;gap:10px;opacity:.6}
footer img{width:20px;height:20px}
footer a{opacity:.6}
@media (max-width:820px){.intro{grid-template-columns:1fr;padding:70px 18px 40px}.rooms{grid-template-columns:1fr;padding:0 18px 80px;gap:56px}header{padding:14px 18px}}
</style>
</head>
<body>
<header>
  <a class="name lbl" href="/"><img src="heart.webp" alt=""><b>Chas Pulido</b></a>
  <nav class="lbl"><a href="/">Portfolio</a><a href="#rooms">Viewing Rooms</a></nav>
</header>
<section class="intro">
  <h1><em>Viewing</em><br>Rooms</h1>
  <p>Four series from the studio in San Francisco, each hung in its own room with full catalogue details, close-up views and a plan of the works at true scale.</p>
</section>
<section class="rooms" id="rooms"></section>
<footer class="lbl"><span class="mk"><img src="heart.webp" alt="">&copy; Chas Pulido</span><a href="/">pulido.art</a></footer>
<script>
(function(){
var IMG='https://pulido.art/img/';
var R={{ROOMS}};
var NW=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
var q=location.search;
function k(n){return n>=1000?'$'+(n/1000).toLocaleString('en-US',{maximumFractionDigits:1})+'K':'$'+n}
document.getElementById('rooms').innerHTML=R.map(function(r){
 return '<a class="room" href="'+r.slug+'/'+q+'"><div class="cover"><img loading="lazy" src="'+IMG+r.hero+'-1600.webp" alt=""></div>'+
 '<div class="strip">'+r.thumbs.filter(function(t){return t!==r.hero}).slice(0,4).map(function(t){return'<img loading="lazy" src="'+IMG+t+'-1000.webp" alt="">'}).join('')+'</div>'+
 '<div class="meta lbl"><span>'+NW[r.n].charAt(0).toUpperCase()+NW[r.n].slice(1)+' paintings &middot; '+r.years+'</span><span>'+k(r.from)+' to '+k(r.to)+'</span></div>'+
 '<h2>'+r.name+'</h2><p>'+r.short+'</p><span class="go lbl">Enter the room &rarr;</span></a>'}).join('');
})();
</script>
</body>
</html>
